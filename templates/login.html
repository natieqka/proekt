{% extends "base.html" %}

{% block content %}
<div class="form-container">
    <h2 style="color: #a55166; text-align: center;">Добре дошли обратно</h2>
    <form method="POST">
        <div class="form-group">
            <label>Потребителско име</label>
            <input type="text" name="username" required>
        </div>
        <div class="form-group">
            <label>Парола</label>
            <input type="password" name="password" required>
        </div>
        <button type="submit" class="btn" style="width: 100%;">Вход →</button>
    </form>
    <p style="text-align: center; margin-top: 1rem;">Нов потребител? <a href="/register" style="color: #a55166;">Създайте профил</a></p>
</div>
{% endblock %}
